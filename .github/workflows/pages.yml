name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Custom domain the demo is served from. Clear it to fall back to
  # https://<user>.github.io/<repo>/ (the build then uses /<repo> as base path).
  CUSTOM_DOMAIN: ota.khoozo.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages has no server: drop the API routes; the app runs them in the browser in static mode.
      - name: Build static export
        run: |
          rm -rf app/api
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export PAGES_BASE_PATH=""
          else
            export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          fi
          echo "Base path: '${PAGES_BASE_PATH}'"
          npm run build
        env:
          STATIC_EXPORT: "1"
      - run: node scripts/flatten-export-segments.mjs out
      - name: Write CNAME for custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > out/CNAME
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
