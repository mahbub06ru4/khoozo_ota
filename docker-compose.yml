services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khoozo-ota:latest
    container_name: khoozo-ota
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      TRAVEL_PROVIDER: ${TRAVEL_PROVIDER:-mock}
    restart: unless-stopped
